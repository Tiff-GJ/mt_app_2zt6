 $("vw").innerHTML=`<div style="text-align:right"><button id="vwx">✕ 閉じる</button></div>${x.prev||x.thumb?`<img src="${x.prev||x.thumb}">`:`<p>${KI[x.kind]} プレビューなし</p>`}

 <p><button class="p" id="vwp">🖼 写真アプリを開く</button></p><p style="color:#ccc;font-size:12px">写真アプリでは、撮影日時の写真を探すか、ファイル名で検索してください。<br>(アプリ内の表示は縮小したプレビューです)</p>`;$("vw").classList.add("on")}
function openCam(){const sc=localStorage.getItem("camsc");let left=false;const f=()=>{if(document.hidden)left=true};document.addEventListener("visibilitychange",f);
 location.href=sc?`shortcuts://run-shortcut?name=${q(sc)}`:"camera://";
 setTimeout(()=>{document.removeEventListener("visibilitychange",f);if(!left&&!document.hidden)toast("カメラを起動できませんでした。\nホーム画面・ロック画面・コントロールセンターのカメラから起動してください。\n(⚙️データでショートカットの設定もできます)")},1800)}
/* ---- 記録の一覧(日付順)と地図 ---- */
function itemHtml(x,rec,en){const m=x.media;
 return`<div class="it"><div class="mu">${KI[x.kind]} ${fdt(x.at)}${en?" ・"+esc(en):""} ${x.lat!=null?`<a href="${posUrl(x)}" target="_blank">📍${x.lat},${x.lng}</a>`:"位置なし"} <button data-ed="${x.id}" style="padding:1px 10px">編集</button>${rec&&x.lat!=null?` <button data-rp="${x.id}" style="padding:1px 10px">地図</button>`:""}</div>
 ${x.label||x.place?`<div><b>${esc(x.label)}</b> ${x.place?"🏷 "+esc(x.place):""}</div>`:""}${x.media?`<div data-vw="${x.id}">${x.thumb?`<img src="${x.thumb}" style="max-height:110px">`:`<span class="mu">${KI[x.kind]} タップで詳細</span>`}</div>`:""}${m?`<div class="mu">${esc(m.file)}(写真アプリ)${m.exif===false?" ※撮影日時の情報なし":""}</div>`:""}
 ${x.text?`<div>${esc(x.text)}</div>`:""}${exps(x).map(y=>`<div>💴 ${esc(y.item)} ${yen(y.price)}×${y.qty}=<b>${yen(y.total)}</b> ${esc(y.note)}</div>`).join("")}</div>`}
function mapEmbed(p){const c=a=>a.lat+","+a.lng;
 if(!p.length)return'<p class="mu">位置のある記録がありません。</p>';
 if(!navigator.onLine)return'<p class="mu">オフラインのため地図は表示できません。</p>';
 return`<iframe src="https://maps.google.com/maps?${p.length>1?`saddr=${c(p[0])}&daddr=${p.slice(1).map(c).join("+to:")}`:`q=${c(p[0])}`}&output=embed"></iframe>`}
function recView(){
 const days=[...new Set(items.map(x=>x.at.slice(0,10)))].sort(),today=lts(now()).slice(0,10);
 if(!days.includes(rday))rday=days.includes(today)?today:days[0]||"";
 const L=items.filter(x=>x.at.slice(0,10)===rday),pts=L.filter(x=>x.lat!=null).slice(0,10),nm=id=>evs().find(e=>e.id===id)?.content||"",c=a=>a.lat+","+a.lng;
 $("ov").innerHTML=`<button id="ec">← 閉じる</button> <button class="p" data-add="auto">🖼 写真・動画を取り込む</button>
 <p class="mu">旅行期間(${trs()})に撮影した写真・動画だけ取り込み、撮影日時のイベントに自動で割り当てます(編集で変更可)。</p>
 <div style="margin:8px 0">${days.map(d=>`<button data-day="${d}"${d===rday?' class="p"':""}>${dl(d+"T00:00")}</button>`).join(" ")}</div>
 <div id="rmap">${mapEmbed(pts)}</div>
 ${pts.length?`<p><a class="btn" target="_blank" href="https://www.google.com/maps/dir/?api=1&origin=${c(pts[0])}&destination=${c(pts.at(-1))}${pts.length>2?"&waypoints="+pts.slice(1,-1).map(c).join("%7C"):""}">Googleマップで開く(${pts.length}地点)</a></p>`:""}
 ${L.map(x=>itemHtml(x,true,nm(x.eventId))).join("")||'<p class="mu">この日の記録はありません。</p>'}`;
 $("ov").classList.add("on")}
/* ---- データ入出力 ---- */
function dataView(){$("ov").innerHTML=`<button id="ec">← 閉じる</button><h3>旅行計画(.mtp)</h3>
 ${trip?`<p class="mu">現在の旅行計画: ${esc(trip.name||trip.mtpFile)}(${esc(trip.mtpFile)}.mtp)</p>`:""}<button class="p" id="bm">→📱 旅行計画を読み込む</button>
 ${trip?`<h3>旅行結果(.mtr)</h3><p class="mu">${items.length}件 / 出力名: ${esc(trip.mtpFile)}.mtr<br>写真・動画は写真アプリに残し、撮影日時・位置・ファイル名で紐づけます(.mtr には本体を含みません)。</p>
 <button class="q" id="bx">📱→ 旅行結果を書き出す</button> <button id="br">→📱 旅行結果を読み込む</button>`:""}
 <h3>カメラの起動(任意)</h3><p class="mu">「カメラを起動」で「カメラ」アプリが開かない場合は、ショートカットアプリで「アプリを開く: カメラ」のショートカットを作り、その名前を入力してください。</p>
 <input id="camsc" placeholder="ショートカット名" value="${esc(localStorage.getItem("camsc")||"")}" onchange="localStorage.setItem('camsc',this.value.trim())">`;$("ov").classList.add("on")}
async function impMtp(f){try{const j=JSON.parse(await f.text());if(!Array.isArray(j.events))throw 0;if(j.version!==4&&!confirm(`この旅行計画は version ${j.version??"不明"} です(対応は version 4)。読み込みを続けますか?`))return;const d=normTrip(j),same=trip&&trip.id===d.id;
 if(trip&&!same&&items.length&&!confirm(`旅行結果が${items.length}件残っています。\n「旅行結果を書き出す」で書き出し済みですか?\n\nOK: 書き出し済み。古い旅行計画と旅行結果を削除して、新しい旅行計画を読み込みます。\nキャンセル: 読み込みを中止します。`))return;
 if(!same){await tx("items","readwrite",o=>o.clear());await tx("trips","readwrite",o=>o.clear())}
 const t={id:d.id,name:d.name,mtpFile:f.name.replace(/\.[^.]*$/,""),data:d};await tx("trips","readwrite",o=>o.put(t));
 trips=[t];trip=t;localStorage.setItem("cur",t.id);await loadItems();closeOv();closeSh();rday="";refresh();setTimeout(goNow,300);toast(same?"旅行計画を更新しました(旅行結果は残しています)":"読み込みました")}catch(e){alert("旅行計画を読み込めませんでした")}}
async function impMtr(f){try{const j=JSON.parse(await f.text());if(!Array.isArray(j.items))throw 0;
 if(j.tripId!==trip.id&&!confirm("別の旅の記録です。取り込みますか?"))return;
 for(const x of j.items){const o=items.find(i=>i.id===x.id)||{};await tx("items","readwrite",s=>s.put(Object.assign({},o,x,{tripId:trip.id})))}
 await loadItems();refresh();dataView();toast(j.items.length+"件を取り込みました")}catch(e){alert(".mtr を読み込めませんでした")}}
async function shareFiles(fs){try{if(navigator.canShare?.({files:fs})){await navigator.share({files:fs});return}}catch(e){if(e.name==="AbortError")return}
 fs.forEach(f=>{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;a.click()})}
document.addEventListener("click",async e=>{const T=e.target,g=s=>T.closest(s),id=T.id;
 if(g("[data-ev]")&&!g("#sh")){sel=g("[data-ev]").dataset.ev;$("sh").style.display="";sheet();$("sh").scrollTop=0;g("[data-ev]").scrollIntoView({block:"start",behavior:"smooth"});return}
 if(id==="sx")return closeSh();
 if(id==="bmap"){const ev=evs().find(x=>x.id===sel),m=ev.place.match(ARROW);
  $("mp").innerHTML=navigator.onLine?`<iframe src="https://maps.google.com/maps?${m?`saddr=${q(m[1])}&daddr=${q(m[2])}`:`q=${q(ev.place)}`}&output=embed"></iframe>`:'<p class="mu">オフラインのため地図は表示できません。</p>';return}
 if(g("[data-add]")){const k=g("[data-add]").dataset.add;if(k==="memo")openEd(base("memo"),true);else{tgt=k==="auto"?"auto":sel;$("fp").click()}return}
 if(g("[data-ed]"))return openEd(items.find(x=>x.id===g("[data-ed]").dataset.ed),false,!!g("#ov"));
 if(g("[data-xadd]")){$("e_ex").insertAdjacentHTML("beforeend",xrow({}));return}
 if(g("[data-xdel]")){g(".xr").remove();exTot();return}
 if(id==="es")return saveEd();if(id==="ec")return closeOv();if(id==="ep"){if(confirm("現在の位置を、いまの現在地で上書きします。\n(自動入力された場所名も、更新される場合があります)\n\nよろしいですか?"))fillPos(true);return}
 if(id==="edl"){if(confirm("削除しますか?")){await tx("items","readwrite",o=>o.delete(ed.x.id));await loadItems();refresh();closeOv()}return}
 if(g("#bar button")){const k=g("#bar button").id;if(k==="bcam")return openCam();if(!trip)return toast("先に旅行計画を読み込んでください");sel=null;if(k==="bn")openEd(base("memo"),true);else{tgt="auto";$("fp").click()}return}
 if(g("[data-vw]"))return viewer(g("[data-vw]").dataset.vw);
 if(id==="vwx")return $("vw").classList.remove("on");
 if(id==="vwp"){location.href="photos-redirect://";return}
 if(id==="rc")return recView();
 if(g("[data-day]")){rday=g("[data-day]").dataset.day;return recView()}
 if(g("[data-rp]")){$("rmap").innerHTML=mapEmbed([items.find(x=>x.id===g("[data-rp]").dataset.rp)]);$("ov").scrollTop=0;return}
 if(id==="go")return dataView();
 if(id==="nw")return goNow();
 if(id==="md"){simOn=!simOn;if(simOn){off=0;$("sim").value=lts(now())}setMd();refresh();return}
 if(id==="bm")return $("fm").click();if(id==="br")return $("fr").click();
 if(id==="bx"){const txt=JSON.stringify({version:3,tripId:trip.id,tripName:trip.name,mtpFile:trip.mtpFile,savedAt:lts(new Date()),items:items.map(({blob,thumb,prev,...r})=>r)},null,2);
  return shareFiles([new File([txt],trip.mtpFile+".mtr",{type:"application/json"})])}
});
const rowTot=r=>{const n=c=>+r.querySelector(c).value.replace(/\D/g,"")||0,q=r.querySelector(".xq").value===""?1:n(".xq");r.querySelector(".xt").value=fc(n(".xp")*q)};
document.addEventListener("input",e=>{const t=e.target;if(!t.classList.contains("cm"))return;fmtComma(t);if(t.classList.contains("xp")||t.classList.contains("xq"))rowTot(t.closest(".xr"));exTot()});
document.addEventListener("change",e=>{const t=e.target,i=t.id;if(!ed)return;
 if(t.classList.contains("qs")){const r=t.closest(".xr"),q=r.querySelector(".xq");if(t.value==="手入力"){q.style.display="";q.focus()}else{q.style.display="none";q.value=t.value;rowTot(r);exTot()}return}
 if(i==="e_plc"&&t.value){$("e_pl").value=t.value;ed.ap=null;t.value=""}
 if(i==="e_atc"&&t.value)$("e_at").value=fdt(t.value);
 if(i==="e_lb")ed.auto=false;
 if(i==="e_atc"||i==="e_at"||i==="e_ev")fillLabels();
 if(i==="e_ev")fillPlaces()});
$("sim").onchange=e=>{const d=new Date(e.target.value);if(!isNaN(d)){off=d-Date.now();refresh()}};
$("fm").onchange=e=>{const f=e.target.files[0];if(f)impMtp(f);e.target.value=""};
$("fr").onchange=e=>{const f=e.target.files[0];if(f)impMtr(f);e.target.value=""};
$("fp").onchange=e=>{addMedia(e.target.files);e.target.value=""};
boot();
</script></body></html>
